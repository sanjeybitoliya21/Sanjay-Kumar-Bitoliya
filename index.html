<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay Kumar Bitoliya | Vlogger</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            /* Aapki pasandida travel watercolor image ka background link */
            background: url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        /* Background को थोड़ा सा डार्क शेड देने के लिए ताकि टेक्स्ट साफ दिखे */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(1px);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            /* White Premium Glass Effect */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }
        
        p.bio {
            font-size: 14px;
            color: #475569;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* Travel Glow Colors for Buttons */
        .youtube {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
        }
        .instagram {
            background: linear-gradient(135deg, #8a2387, #e94057, #f27121);
        }
        .facebook {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
        }

        /* Hover Animation */
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            filter: brightness(1.05);
        }

        .link-card i {
            font-size: 18px;
        }

        .arrow-icon {
            font-size: 12px !important;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Avatar/Profile Picture -->
        <img src="myphoto.jpg" alt="Sanjay" class="profile-img" onerror="this.src='https://flaticon.com'">
        
        <h1>Sanjay Kumar Bitoliya</h1>
        <p class="bio">✈️ Travel & Lifestyle Vlogger 🗺️</p>

        <div class="links-container">
            <!-- 1. YouTube Button -->
            <a href="https://youtube.com" target="_blank" class="link-card youtube">
                <span><i class="fab fa-youtube" style="margin-right: 8px;"></i> YouTube Channel</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- 2. Instagram Button -->
            <a href="https://instagram.com" target="_blank" class="link-card instagram">
                <span><i class="fab fa-instagram" style="margin-right: 8px;"></i> Instagram</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- 3. Facebook Button -->
            <a href="https://facebook.com" target="_blank" class="link-card facebook">
                <span><i class="fab fa-facebook" style="margin-right: 8px;"></i> Facebook</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            © 2026 | EXPLORE WITH SANJAY
        </div>
    </div>

</body>
</html>
