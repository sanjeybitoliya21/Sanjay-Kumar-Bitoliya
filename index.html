<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay Kumar Bitoliya | Official</title>
    <!-- Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts Link -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1a103c 0%, #070410 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        /* Glowing Background Elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            filter: blur(150px);
            opacity: 0.2;
            z-index: 0;
        }
        body::before { top: 10%; left: 10%; background: #06b6d4; }
        body::after { bottom: 10%; right: 10%; background: #d946ef; }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(15, 12, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 430px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .profile-container {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 5px;
            background: rgba(255, 255, 255, 0.03);
        }
        .profile-container::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #000);
            z-index: -1;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #00f2fe, #4facfe, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        p.bio {
            font-size: 16px;
            color: #a78bfa;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 25px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .link-card i {
            font-size: 22px;
        }
        .arrow-icon {
            font-size: 14px !important;
            opacity: 0.5;
            transition: transform 0.3s ease;
        }
        /* Neon Glow Effects on Hover */
        .youtube:hover {
            background: rgba(255, 0, 85, 0.1);
            border-color: #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }
        .instagram:hover {
            background: rgba(217, 70, 239, 0.1);
            border-color: #d946ef;
            box-shadow: 0 0 25px rgba(217, 70, 239, 0.4);
            text-shadow: 0 0 8px rgba(217, 70, 239, 0.6);
        }
        .facebook:hover {
            background: rgba(0, 242, 254, 0.1);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }
        .link-card:hover .arrow-icon {
            transform: translateX(5px);
            opacity: 1;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #6d6280;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-container">
            <!-- Profile Picture -->
            <img src="myphoto.jpg" alt="Sanjay" class="profile-img" onerror="this.src='https://flaticon.com'">
        </div>
        
        <h1>Sanjay Kumar bitoliya</h1>
        <p class="bio">Digital Creator</p>

        <div class="links-container">
            <!-- 1. YouTube Button -->
            <a href="https://youtube.com" target="_blank" class="link-card youtube">
                <span><i class="fab fa-youtube" style="color: #ff0055; margin-right: 12px;"></i> YouTube</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- 2. Instagram Button -->
            <a href="https://instagram.com" target="_blank" class="link-card instagram">
                <span><i class="fab fa-instagram" style="color: #d946ef; margin-right: 12px;"></i> Instagram</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>

            <!-- 3. Facebook Button -->
            <a href="https://facebook.com" target="_blank" class="link-card facebook">
                <span><i class="fab fa-facebook" style="color: #00f2fe; margin-right: 12px;"></i> Facebook</span>
                <i class="fas fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            // CREATED BY SANJAY //
        </div>
    </div>

</body>
</html>
