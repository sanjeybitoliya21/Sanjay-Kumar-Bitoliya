<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay Kumar Bitoliya | Official Website</title>
    <!-- Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts Link -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        p.bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .link-card i {
            font-size: 20px;
        }
        /* Button Colors & Hover Effects */
        .youtube {
            background: #e11d48;
        }
        .youtube:hover {
            background: #be123c;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(225, 29, 72, 0.4);
        }
        .instagram {
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
        }
        .instagram:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(238, 42, 123, 0.4);
        }
        .facebook {
            background: #2563eb;
        }
        .facebook:hover {
            background: #1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(37, 99, 235, 0.4);
        }
        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Default Profile Picture -->
        <img src="myphoto.jpg" alt="Sanjay" class="profile-img" onerror="this.src='https://flaticon.com'">
        
        <h1>Sanjay Kumar Bitoliya</h1>
        <p class="bio">Welcome to my official website! Connect with me below.</p>

        <div class="links-container">
            <!-- 1. YouTube Button (Aapka Link Lag Chuka Hai) -->
            <a href="https://www.youtube.com/@SanjayBitoliyaVlogs" target="_blank" class="link-card youtube">
                <i class="fab fa-youtube"></i> Subscribe on YouTube
            </a>

            <!-- 2. Instagram Button -->
            <!-- Note: Aap bad me yahan bna link change kr skte hain -->
            <a href="https://instagram.com" target="_blank" class="link-card instagram">
                <i class="fab fa-instagram"></i> Follow on Instagram
            </a>

            <!-- 3. Facebook Button -->
            <!-- Note: Aap bad me yahan bna link change kr skte hain -->
            <a href="https://facebook.com" target="_blank" class="link-card facebook">
                <i class="fab fa-facebook"></i> Connect on Facebook
            </a>
        </div>

        <div class="footer">
            © 2026 Designed by Sanjay
        </div>
    </div>

</body>
</html>
